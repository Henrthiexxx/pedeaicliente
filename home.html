<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pedra Delivery</title>
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.json">
<script>(function(){var t=localStorage.getItem('pedrad-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="stylesheet" href="client.css">
<script src="pwa-register.js" defer></script>
<script src="page-transition.js" defer></script>
<style>
/* ── Page enter ── */
@keyframes appIn {
  from { opacity: 0; transform: scale(1.03); }
  to   { opacity: 1; transform: scale(1); }
}
body { animation:appIn .21s cubic-bezier(.16,1,.3,1) both; }

/* ── Design tokens ── */
:root {
  --g: #22c55e;
  --g-dim: rgba(34,197,94,.10);
  --g-glow: rgba(34,197,94,.18);
  --surface: #0e0e11;
  --surface-2: #121216;
  --glass: rgba(14,14,17,.82);
  --bottom-nav-h: calc(64px + env(safe-area-inset-bottom, 0px));
}

/* ── Reset body for this page ── */
html {
  height: 100%;
  overflow: hidden;
  background: #080808;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background:
    radial-gradient(ellipse 110% 32% at 50% 0%, #0d2018 0%, transparent 68%),
    radial-gradient(ellipse 80% 20% at 50% 100%, #090d0a 0%, transparent 60%),
    #080808;
}

.home-scroll {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: var(--bottom-nav-h);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #2a2a34; border-radius: 2px; }

/* ════════════════════════════════
   HEADER
════════════════════════════════ */
.home-hdr {
  position: sticky;
  top: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 14px;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid rgba(255,255,255,.04);
}

.home-logo {
  display: flex;
  align-items: center;
  gap: 9px;
}

.home-logo-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.home-logo-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.home-logo-text {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -.03em;
  color: #f0f0f2;
}

.home-logo-text span {
  color: var(--g);
}

.notif-btn {
  width: 36px;
  height: 36px;
  border: none;
  background: var(--surface-2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #8888a0;
  transition: background .15s, color .15s;
  flex-shrink: 0;
}

.notif-btn:hover { background: #1c1c22; color: #f0f0f2; }

.notif-btn svg { width: 17px; height: 17px; }

/* ════════════════════════════════
   SEARCH
════════════════════════════════ */
.home-search {
  padding: 14px 16px 0;
}

.search-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid #1e1e26;
  border-radius: 999px;
  padding: 0 16px;
  transition: border-color .18s;
}

.search-wrap:focus-within {
  border-color: rgba(34,197,94,.35);
  box-shadow: 0 0 0 3px rgba(34,197,94,.06);
}

.search-wrap svg {
  width: 16px;
  height: 16px;
  color: #44444e;
  flex-shrink: 0;
}

.search-wrap input {
  flex: 1;
  padding: 12px 0;
  background: none;
  border: none;
  color: #f0f0f2;
  font-family: inherit;
  font-size: .88rem;
  outline: none;
}

.search-wrap input::placeholder { color: #44444e; }

/* ════════════════════════════════
   CATEGORIES
════════════════════════════════ */
.cat-bar {
  display: flex;
  gap: 7px;
  padding: 14px 16px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }

.cat-pill {
  flex-shrink: 0;
  padding: 10px 18px;
  font-size: .76rem;
  font-weight: 600;
  border-radius: 14px;
  border: 1px solid #191920;
  background: #111116;
  color: #505060;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: all .18s;
  letter-spacing: -.01em;
  box-shadow:
    0 2px 8px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.cat-pill:hover {
  border-color: #252530;
  color: #b0b0c0;
  box-shadow:
    0 4px 12px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateY(-1px);
}

.cat-pill:active { transform: translateY(0); }

.cat-pill.active {
  background: rgba(34,197,94,.10);
  border-color: rgba(34,197,94,.28);
  color: #22c55e;
  box-shadow:
    0 4px 16px rgba(34,197,94,.14),
    inset 0 1px 0 rgba(34,197,94,.12);
}

/* ════════════════════════════════
   ADDRESS BAR (compacta)
════════════════════════════════ */
.addr-bar-wrap {
  margin: 0 0 2px;
}

.addr-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 16px;
  background: linear-gradient(180deg, rgba(34,197,94,.05) 0%, transparent 100%);
  border: none;
  border-top: 1px solid rgba(34,197,94,.14);
  border-bottom: 1px solid rgba(34,197,94,.14);
  border-radius: 0;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: background .16s;
}

.addr-bar:hover { background: linear-gradient(180deg, rgba(34,197,94,.09) 0%, transparent 100%); }
.addr-bar:active { background: rgba(34,197,94,.06); }

.addr-bar-pin {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--g-dim);
  color: var(--g);
  box-shadow: inset 0 0 10px rgba(34,197,94,.18);
}
.addr-bar-pin svg { width: 14px; height: 14px; }

.addr-bar-text {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: .8rem;
  line-height: 1.2;
}

.addr-bar-label { font-weight: 700; color: #f0f0f2; letter-spacing: -.01em; }
.addr-bar-sep { color: #3a3a44; margin: 0 6px; }
.addr-bar-line { color: #7a7a88; }

.addr-bar-chev {
  flex-shrink: 0;
  color: var(--g);
  opacity: .85;
  display: flex;
  align-items: center;
}
.addr-bar-chev svg { width: 15px; height: 15px; }

/* ── Bottom sheet ── */
.addr-sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 650;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.addr-sheet-overlay.show { display: flex; animation: addrFade .2s ease; }
@keyframes addrFade { from { opacity: 0; } to { opacity: 1; } }

.addr-sheet {
  width: 100%;
  max-width: 520px;
  background:
    radial-gradient(ellipse 120% 42% at 50% 0%, #0d2018 0%, transparent 60%),
    #0b0b0e;
  border: 1px solid rgba(34,197,94,.14);
  border-bottom: none;
  border-radius: 22px 22px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -20px 50px rgba(0,0,0,.6);
  animation: addrSlide .28s cubic-bezier(.16,1,.3,1);
}
@keyframes addrSlide { from { transform: translateY(100%); } to { transform: translateY(0); } }

.addr-sheet-handle {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: #26262e;
  margin: 4px auto 14px;
}

.addr-sheet-title {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #44444e;
  margin-bottom: 12px;
  padding: 0 2px;
}

.addr-sheet-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 50vh;
  overflow-y: auto;
  margin-bottom: 12px;
}

.addr-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid #18181e;
  border-radius: 14px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.addr-opt:hover { border-color: #23232c; }
.addr-opt.selected { border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.06); }

.addr-opt-pin {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--g-dim);
  color: var(--g);
}
.addr-opt-pin svg { width: 16px; height: 16px; }

.addr-opt-body { flex: 1; min-width: 0; }
.addr-opt-label { font-size: .86rem; font-weight: 700; color: #e8e8ee; }
.addr-opt-line {
  font-size: .73rem;
  color: #6a6a78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.addr-opt-check { flex-shrink: 0; color: var(--g); display: none; align-items: center; }
.addr-opt.selected .addr-opt-check { display: flex; }
.addr-opt-check svg { width: 18px; height: 18px; }

.addr-sheet-add {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px;
  background: transparent;
  border: 1px dashed rgba(34,197,94,.3);
  border-radius: 14px;
  color: var(--g);
  font-size: .84rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.addr-sheet-add:hover { background: rgba(34,197,94,.06); border-color: rgba(34,197,94,.5); }
.addr-sheet-add svg { width: 16px; height: 16px; }

/* ════════════════════════════════
   REPETIR PEDIDO
════════════════════════════════ */
.repeat-wrap {
  padding: 16px 16px 0;
}

.repeat-card {
  position: relative;
  border-radius: 18px;
  background:
    radial-gradient(120% 120% at 100% 0%, rgba(34,197,94,.09) 0%, transparent 55%),
    linear-gradient(180deg, #0e1512 0%, #0b0e0c 100%);
  border: 1px solid rgba(34,197,94,.18);
  box-shadow:
    0 0 0 1px rgba(34,197,94,.05),
    0 12px 32px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.03);
  padding: 13px 14px 12px;
  overflow: hidden;
}

.repeat-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: right center;
  background-repeat: no-repeat;
  z-index: 0;
  pointer-events: none;
}

.repeat-content {
  position: relative;
  z-index: 1;
}

.repeat-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50%;
  background: rgba(8,8,8,.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: #8a8a98;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.repeat-close:hover { background: rgba(8,8,8,.7); color: #f0f0f2; }
.repeat-close svg { width: 14px; height: 14px; }

.repeat-info {
  min-width: 0;
  max-width: 72%;
}

.repeat-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--g);
  margin-bottom: 5px;
}

.repeat-eyebrow::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--g);
  box-shadow: 0 0 8px rgba(34,197,94,.85);
}

.repeat-store {
  font-size: .98rem;
  font-weight: 800;
  color: #f0f0f2;
  letter-spacing: -.03em;
  line-height: 1.15;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.repeat-summary {
  font-size: .73rem;
  color: rgba(160,160,180,.62);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.repeat-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 11px;
}

@keyframes repeatGlow {
  0%, 100% { box-shadow: 0 6px 0 #0e8038, 0 10px 24px rgba(34,197,94,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  50%      { box-shadow: 0 6px 0 #0e8038, 0 14px 34px rgba(34,197,94,.6), inset 0 1px 0 rgba(255,255,255,.25); }
}

.repeat-btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px 26px;
  background: linear-gradient(180deg, #2edb6b 0%, #1db857 100%);
  color: #041a0c;
  font-size: .86rem;
  font-weight: 800;
  font-family: inherit;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  letter-spacing: -.01em;
  transform: translateY(-2px);
  transition: transform .14s, box-shadow .14s;
  animation: repeatGlow 2.6s ease-in-out infinite;
}

.repeat-btn-primary:hover {
  animation: none;
  transform: translateY(-4px);
  box-shadow: 0 8px 0 #0e8038, 0 16px 36px rgba(34,197,94,.52), inset 0 1px 0 rgba(255,255,255,.28);
}

.repeat-btn-primary:active {
  animation: none;
  transform: translateY(2px);
  box-shadow: 0 2px 0 #0e8038, 0 4px 12px rgba(34,197,94,.28), inset 0 1px 0 rgba(255,255,255,.15);
}

.repeat-btn-primary:disabled { opacity: .65; cursor: default; animation: none; }

.repeat-btn-primary svg { width: 15px; height: 15px; }

.repeat-btn-secondary {
  flex-shrink: 0;
  padding: 13px 22px;
  background: #121216;
  color: #b0b0c0;
  font-size: .82rem;
  font-weight: 700;
  font-family: inherit;
  border: 1px solid #20202a;
  border-radius: 14px;
  cursor: pointer;
  letter-spacing: -.01em;
  transition: border-color .15s, color .15s, background .15s;
}

.repeat-btn-secondary:hover { border-color: #2a2a36; color: #f0f0f2; background: #16161c; }
.repeat-btn-secondary:active { background: #0e0e12; }

/* ════════════════════════════════
   FEATURED BANNER
════════════════════════════════ */
.banner-wrap {
  padding: 18px 16px 0;
}

.featured-banner {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background-color: #081209;
  border: 1px solid rgba(34,197,94,.14);
  box-shadow:
    0 0 0 1px rgba(34,197,94,.06),
    0 20px 50px rgba(0,0,0,.7),
    0 4px 16px rgba(0,0,0,.5);
  min-height: 168px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
}

.featured-banner:active { cursor: grabbing; }

.bn-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity .55s ease;
}

.bn-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 168px;
  padding: 20px 18px 18px;
  transition: opacity .2s ease;
}

.banner-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .64rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--g);
  background: var(--g-dim);
  border: 1px solid rgba(34,197,94,.24);
  border-radius: 999px;
  padding: 3px 9px;
  margin-bottom: 8px;
  width: fit-content;
}

.banner-tag::before {
  content: '';
  width: 5px;
  height: 5px;
  background: var(--g);
  border-radius: 50%;
}

.banner-title {
  font-size: 1.18rem;
  font-weight: 800;
  color: #f0f0f2;
  letter-spacing: -.04em;
  line-height: 1.15;
  margin-bottom: 4px;
}

.banner-sub {
  font-size: .74rem;
  color: rgba(160,160,180,.6);
  margin-bottom: 14px;
  line-height: 1.4;
}

.banner-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.banner-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 13px 26px;
  background: linear-gradient(180deg, #2edb6b 0%, #1db857 100%);
  color: #041a0c;
  font-size: .86rem;
  font-weight: 800;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: -.01em;
  text-decoration: none;
  box-shadow:
    0 6px 0 #0e8038,
    0 10px 28px rgba(34,197,94,.45),
    inset 0 1px 0 rgba(255,255,255,.25);
  transform: translateY(-2px);
  transition: transform .14s, box-shadow .14s;
}

.banner-btn:hover {
  transform: translateY(-4px);
  box-shadow:
    0 8px 0 #0e8038,
    0 16px 36px rgba(34,197,94,.52),
    inset 0 1px 0 rgba(255,255,255,.28);
}

.banner-btn:active {
  transform: translateY(2px);
  box-shadow:
    0 2px 0 #0e8038,
    0 4px 12px rgba(34,197,94,.28),
    inset 0 1px 0 rgba(255,255,255,.15);
}

.banner-dots {
  display: flex;
  gap: 5px;
  align-items: center;
}

.banner-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
}

.banner-dot.active {
  width: 16px;
  border-radius: 999px;
  background: var(--g);
  opacity: .85;
}

/* ════════════════════════════════
   STORES SECTION
════════════════════════════════ */
.stores-section {
  padding: 20px 0 16px;
}

.nav-spacer {
  display: none;
}

.section-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 12px;
}

.section-label {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #44444e;
}

.section-count {
  font-size: .7rem;
  color: #44444e;
}

.stores-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 14px;
}

/* Store card */
.store-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 14px;
  background: var(--surface);
  border: 1px solid #161619;
  border-radius: 16px;
  cursor: pointer;
  transition: border-color .18s, background .18s;
  position: relative;
  overflow: hidden;
}

.store-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background .18s;
  pointer-events: none;
}

.store-card:hover { border-color: #222228; }
.store-card:hover::before { background: rgba(255,255,255,.016); }
.store-card:active::before { background: rgba(255,255,255,.03); }

.store-card.closed { opacity: .52; cursor: default; }
.store-card.closed:hover { border-color: #161619; }
.store-card.closed:hover::before { background: none; }

.sc-logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #19191e;
  border: 1px solid #1e1e26;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #34343e;
  flex-shrink: 0;
  font-size: 1.2rem;
}

.sc-logo img { width: 100%; height: 100%; object-fit: cover; }

.sc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sc-name {
  font-size: .9rem;
  font-weight: 700;
  color: #d8d8e0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -.02em;
}

.sc-cat {
  font-size: .7rem;
  color: #44444e;
  margin-bottom: 4px;
}

.sc-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .68rem;
  color: #54545e;
}

.sc-rating {
  display: flex;
  align-items: center;
  gap: 3px;
  color: #c0c02a;
  font-weight: 600;
}

<script>
const FC={apiKey:"AIzaSyAnIJRcUxN-0swpVnonPbJjTSK87o4CQ_g",authDomain:"pedrad-814d0.firebaseapp.com",projectId:"pedrad-814d0",storageBucket:"pedrad-814d0.appspot.com",messagingSenderId:"293587190550",appId:"1:293587190550:web:80c9399f82847c80e20637"};
if(!firebase.apps.length)firebase.initializeApp(FC);
const auth=firebase.auth();
const db=firebase.firestore();

let stores=[],catFilter='all';
const DAY_KEYS=['sun','mon','tue','wed','thu','fri','sat'];

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}
function getTheme(){return localStorage.getItem('pedrad-theme')||'dark'}

function parseHM(s){const[h,m]=String(s||'00:00').split(':').map(Number);return(h||0)*60+(m||0)}

function legacyHoursToNew(s){
  if(!s)return null;
  const wO=s.weekdayOpen,wC=s.weekdayClose,eO=s.weekendOpen,eC=s.weekendClose;
  if(!wO&&!eO)return null;
  const wOpen=wO||'11:00',wClose=wC||'22:00',eOpen=eO||'11:00',eClose=eC||'23:00';
  return{
    mon:{enabled:true,open:wOpen,close:wClose},tue:{enabled:true,open:wOpen,close:wClose},
    wed:{enabled:true,open:wOpen,close:wClose},thu:{enabled:true,open:wOpen,close:wClose},
    fri:{enabled:true,open:wOpen,close:wClose},
    sat:{enabled:true,open:eOpen,close:eClose},sun:{enabled:true,open:eOpen,close:eClose},
    holidays:{enabled:false,open:'11:00',close:'22:00'}
  };
}

function isStoreOpen(store){
  if(store.manuallyClosed===true)return false;
  const hours=store?.settings?.hours||legacyHoursToNew(store?.settings);
  if(!hours)return store.open!==false;
  const now=new Date();
  const day=hours[DAY_KEYS[now.getDay()]];
  if(!day||day.enabled===false)return false;
  const cur=now.getHours()*60+now.getMinutes();
  const open=parseHM(day.open),close=parseHM(day.close);
  if(open===close)return false;
  return close>open?(cur>=open&&cur<close):(cur>=open||cur<close);
}

const STORES_CACHE_KEY='pedrad_stores_cache';
const STORES_CACHE_TTL=5*60*1000; // 5 min

function loadStoresFromCache(){
  try{
    const raw=localStorage.getItem(STORES_CACHE_KEY);
    if(!raw)return false;
    const {ts,data}=JSON.parse(raw);
    if(Date.now()-ts>STORES_CACHE_TTL)return false;
    stores=data.map(s=>({...s,isOpenNow:isStoreOpen(s)}));
    renderCats();render();
    return true;
  }catch(e){return false;}
}

async function loadStores(){
  const hadCache=loadStoresFromCache(); // renderiza imediatamente se cache válido
  const snap=await db.collection('stores').get();
  const fresh=snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(s=>!s.suspended)
    .map(s=>({...s,isOpenNow:isStoreOpen(s)}));
  fresh.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR'));
  try{localStorage.setItem(STORES_CACHE_KEY,JSON.stringify({ts:Date.now(),data:fresh}));}catch(e){}
  stores=fresh;
  renderCats();render();
}

function refreshStoreStatuses(){
  if(!stores.length)return;
  let changed=false;
  stores=stores.map(s=>{
    const isOpenNow=isStoreOpen(s);
    if(isOpenNow===s.isOpenNow)return s;
    changed=true;
    return{...s,isOpenNow};
  });
  if(changed){renderCats();render()}
}

setInterval(()=>{if(!document.hidden)refreshStoreStatuses();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshStoreStatuses();});

function renderCats(){
  const base=stores.filter(s=>s.isOpenNow);
  const cats=[...new Set(base.map(s=>s.category).filter(Boolean))].sort();
  document.getElementById('catFilter').innerHTML=
    `<button class="cat-pill ${catFilter==='all'?'active':''}" onclick="setCat('all')">Todos</button>`
    +cats.map(c=>`<button class="cat-pill ${catFilter===c?'active':''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('')
    +`<button class="cat-pill ${catFilter==='inactive'?'active':''}" onclick="setCat('inactive')">Inativas</button>`;
}

function setCat(c){catFilter=c;renderCats();render()}
function goStore(id){navigateTo('store.html?id='+id)}
window.selectStore = goStore;
window.openStore = goStore;
function goInfo(id,e){
  if(e)e.stopPropagation();
  const s=stores.find(x=>x.id===id);
  if(s&&!s.isOpenNow)return showClosedStorePopup(s);
  navigateTo('store-info.html?id='+id);
}
function showClosedStorePopup(store){
  document.getElementById('closedStoreText').textContent=`${store?.name||'Esta loja'} está cadastrada, mas está fechada no momento.`;
  document.getElementById('closedStoreModal').classList.add('show');
}
function showClosedStorePopupById(id){showClosedStorePopup(stores.find(s=>s.id===id))}
function hideClosedStorePopup(){document.getElementById('closedStoreModal').classList.remove('show')}
function closeClosedStorePopup(e){if(e.target.id==='closedStoreModal')hideClosedStorePopup()}

function render(){
  const showingInactive=catFilter==='inactive';
  let list=stores.filter(s=>showingInactive?!s.isOpenNow:s.isOpenNow);
  if(catFilter!=='all'&&!showingInactive)list=list.filter(s=>(s.category||'')===catFilter);

  const el=document.getElementById('storesList');
  const countEl=document.getElementById('storeCount');

  if(!list.length){
    countEl.textContent='';
    el.innerHTML=`<div class="stores-empty">${showingInactive?'Nenhuma loja inativa no momento':'Nenhuma loja aberta no momento'}</div>`;
    return;
  }

  countEl.textContent=list.length+' loja'+(list.length!==1?'s':'');

  el.innerHTML=list.map(s=>{
    const img=s.imageUrl||'';
    const closed=!s.isOpenNow;
    const rating=s.rating?`<span class="sc-rating">★ ${s.rating.toFixed(1)}</span><span class="sc-dot">·</span>`:'' ;
    const time=s.deliveryTime?`<span class="sc-time">${esc(s.deliveryTime)}</span>`:'';
    return`<div class="store-card ${closed?'closed':''}" onclick="${closed?`showClosedStorePopupById('${s.id}')`:`goStore('${s.id}')`}">
      <div class="sc-logo">${img?`<img src="${esc(img)}" alt="">`:''}</div>
      <div class="sc-body">
        <div class="sc-name">${esc(s.name)}</div>
        ${s.category?`<div class="sc-cat">${esc(s.category)}</div>`:''}
        <div class="sc-meta">
          ${rating}${time}
          ${closed?`<span class="sc-dot">·</span><span style="color:#f87171;font-size:.64rem;font-weight:600">Fechada</span>`:''}
        </div>
      </div>
      ${closed?`<div class="sc-status">Fechada</div>`:`<div class="sc-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>`}
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════
   BANNER CAROUSEL
   — Edite cada entrada do array para alterar
     texto, subtítulo e botão de cada slide
══════════════════════════════════════════ */
const BANNERS = [
  { img:'banner.png',  tag:'Destaques e ofertas', title:'Ofertas<br>em Destaque', sub:'Produtos em promoção nas lojas', btn:'Ver ofertas', href:'ofertas.html' },
  { img:'banner2.png', tag:'Novidades', title:'Chegando<br>Agora',   sub:'Últimas adições à plataforma',            btn:'Ver novidades',  href:'novidades.html' },
  { img:'banner4.png', tag:'Top Lojas', title:'Mais<br>Avaliadas',   sub:'As mais elogiadas da sua região',         btn:'Ver ranking',   href:'ranking.html'    },
  /*
  { img:'banner5.png', tag:'Exclusivo', title:'Para<br>Você',        sub:'Selecionado com base nos seus pedidos',   btn:'Ver seleção',   href:'selecao.html'    },
  */
];

const BN_GRAD='linear-gradient(to bottom,rgba(0,0,0,.18) 0%,rgba(4,12,7,.88) 50%,rgba(4,12,7,.97) 100%)';
let bnIdx=0, bnTimer=null;
const bnBgA=document.getElementById('bnBgA');
const bnBgB=document.getElementById('bnBgB');
const bnContent=document.getElementById('bnContent');
let bnFront=bnBgA;

function bnRenderDots(){
  document.getElementById('bannerDots').innerHTML=
    BANNERS.map((_,i)=>`<div class="banner-dot${i===bnIdx?' active':''}" onclick="goToBanner(${i})"></div>`).join('');
}

function bnApply(idx,animate){
  const b=BANNERS[idx];
  const back=bnFront===bnBgA?bnBgB:bnBgA;
  back.style.backgroundImage=`${BN_GRAD},url('${b.img}')`;
  back.style.opacity='0';
  void back.offsetWidth; // force reflow so transition fires
  bnFront.style.opacity='0';
  back.style.opacity='1';
  if(animate){
    bnContent.style.opacity='0';
    setTimeout(()=>{
      document.getElementById('bnTag').innerHTML=b.tag;
      document.getElementById('bnTitle').innerHTML=b.title;
      document.getElementById('bnSub').textContent=b.sub;
      document.getElementById('bnBtn').href=b.href;
      document.getElementById('bnBtnText').textContent=b.btn;
      bnContent.style.opacity='1';
    },220);
  }else{
    document.getElementById('bnTag').innerHTML=b.tag;
    document.getElementById('bnTitle').innerHTML=b.title;
    document.getElementById('bnSub').textContent=b.sub;
    document.getElementById('bnBtn').href=b.href;
    document.getElementById('bnBtnText').textContent=b.btn;
  }
  bnFront=back; bnIdx=idx; bnRenderDots();
}

function goToBanner(idx){if(idx===bnIdx)return;bnApply(idx,true);bnResetTimer();}
function bnNext(){goToBanner((bnIdx+1)%BANNERS.length);}
function bnPrev(){goToBanner((bnIdx-1+BANNERS.length)%BANNERS.length);}
function bnResetTimer(){clearInterval(bnTimer);bnTimer=setInterval(bnNext,10000);}

// Init primeiro slide
(function(){
  const b=BANNERS[0];
  bnBgA.style.backgroundImage=`${BN_GRAD},url('${b.img}')`;
  bnBgA.style.opacity='1';
  document.getElementById('bnTag').innerHTML=b.tag;
  document.getElementById('bnTitle').innerHTML=b.title;
  document.getElementById('bnSub').textContent=b.sub;
  document.getElementById('bnBtn').href=b.href;
  document.getElementById('bnBtnText').textContent=b.btn;
  bnRenderDots();
  bnResetTimer();
})();

// Swipe / arrasto
(function(){
  const el=document.getElementById('featBanner');
  let sx=0, moved=false;
  el.addEventListener('pointerdown',e=>{sx=e.clientX;moved=false;},{passive:true});
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>8)moved=true;},{passive:true});
  el.addEventListener('pointerup',e=>{const dx=e.clientX-sx;if(moved&&Math.abs(dx)>40){dx<0?bnNext():bnPrev();}});
  // impede click no botão/dots quando foi arrasto
  el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
})();

document.addEventListener('visibilitychange',()=>{document.hidden?clearInterval(bnTimer):bnResetTimer();});

/* ══════════════════════════════════════════
   BARRA DE ENDEREÇO COMPACTA
   — Troca rápida do local de entrega sem
     sair da tela inicial (dropdown bottom sheet)

let userAddresses=[], selectedAddrId=null;
const SEL_ADDR_KEY='pedrad_selected_address';
function addrCacheKey(uid){return 'cache_addresses_v1_'+uid}

function addrSummary(a){
  if(!a)return '';
  let s=a.street||'';
  if(a.number)s+=(s?', ':'')+a.number;
  if(!s)s=a.neighborhood||'';
  return s;
}
function addrFull(a){
  const s=addrSummary(a);
  if(a&&a.neighborhood&&a.neighborhood!==s)return s?`${s} • ${a.neighborhood}`:a.neighborhood;
  return s;
}
function pickSelectedAddr(){
  let stored=null;try{stored=localStorage.getItem(SEL_ADDR_KEY)}catch(_){}
  if(stored&&userAddresses.some(a=>a.id===stored))return stored;
  return userAddresses[0]?.id||null;
}

function renderAddrBar(){
  const wrap=document.getElementById('addrBarWrap');
  if(!wrap)return;
  const labelEl=document.getElementById('addrBarLabel');
  const sepEl=document.getElementById('addrBarSep');
  const lineEl=document.getElementById('addrBarLine');
  if(!userAddresses.length){
    labelEl.textContent='Endereço';
    sepEl.style.display='none';
    lineEl.textContent='Adicionar endereço de entrega';
    wrap.style.display='';
    return;
  }
  const a=userAddresses.find(x=>x.id===selectedAddrId)||userAddresses[0];
  labelEl.textContent=a.label||'Endereço';
  sepEl.style.display='';
  lineEl.textContent=addrSummary(a)||'—';
  wrap.style.display='';
}

async function loadAddresses(){
  const uid=auth.currentUser?.uid;
  if(!uid)return;
  try{ // render instantâneo via cache compartilhado com o checkout
    const c=JSON.parse(localStorage.getItem(addrCacheKey(uid))||'null');
    if(c&&Array.isArray(c.data)){userAddresses=c.data;selectedAddrId=pickSelectedAddr();renderAddrBar();}
  }catch(_){}
  try{
    const snap=await db.collection('users').doc(uid).collection('addresses').get();
    userAddresses=snap.docs.map(d=>({id:d.id,...d.data()}));
    try{localStorage.setItem(addrCacheKey(uid),JSON.stringify({ts:Date.now(),data:userAddresses}));}catch(_){}
    selectedAddrId=pickSelectedAddr();
    renderAddrBar();
  }catch(e){console.warn('Endereços: consulta falhou',e);}
}

function renderAddrSheet(){
  const list=document.getElementById('addrSheetList');
  if(!list)return;
  const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  list.innerHTML=userAddresses.map(a=>{
    const sel=a.id===selectedAddrId?'selected':'';
    return`<div class="addr-opt ${sel}" onclick="selectAddr('${esc(a.id)}')">
      <span class="addr-opt-pin">${pin}</span>
      <span class="addr-opt-body">
        <span class="addr-opt-label">${esc(a.label||'Endereço')}</span>
        <span class="addr-opt-line">${esc(addrFull(a)||'—')}</span>
      </span>
      <span class="addr-opt-check">${check}</span>
    </div>`;
  }).join('');
}

function openAddrSheet(){
  if(!userAddresses.length){goAddAddress();return;}
  renderAddrSheet();
  document.getElementById('addrSheetOverlay').classList.add('show');
}
function closeAddrSheet(e){
  if(e&&e.target&&e.target.id!=='addrSheetOverlay')return;
  document.getElementById('addrSheetOverlay').classList.remove('show');
}
function selectAddr(id){
  selectedAddrId=id;
  try{localStorage.setItem(SEL_ADDR_KEY,id);}catch(_){}
  renderAddrBar();
  const a=userAddresses.find(x=>x.id===id);
  closeAddrSheet();
  toast('Entregar em '+(a?.label||'endereço'));
}
function goAddAddress(){navigateTo('address.html')}

/* ══════════════════════════════════════════
   REPETIR PEDIDO
   — Card do último pedido concluído, recompra
     em um toque a partir da tela inicial
══════════════════════════════════════════ */
let lastOrder=null;
const REPEAT_DISMISS_KEY='pedrad_repeat_dismissed';

function tsDate(v){return v?.toDate?.()||new Date(v||0)}
function isPromoActive(p){
  if(p.promo!==true&&p.promotional!==true&&p.onSale!==true)return false;
  if(p.promotionStatus==='inactive')return false;
  const now=Date.now(),start=tsDate(p.promotionStartsAt).getTime()||0,end=tsDate(p.promotionEndsAt).getTime()||0;
  return(!start||start<=now)&&(!end||end>=now);
}
function productPrice(p){
  const promo=Number(p.promoPrice||p.discountPrice||p.salePrice||0);
  const price=Number(p.price||0);
  return isPromoActive(p)&&promo>0&&promo<price?promo:price;
}

function repeatSummary(items){
  return (items||[]).map(i=>`${i.qty||1}x ${i.name||''}`.trim()).filter(Boolean).join(' • ');
}

async function loadLastOrder(){
  const uid=auth.currentUser?.uid;
  if(!uid)return;
  let snap;
  try{
    snap=await db.collection('orders')
      .where('userId','==',uid)
      .orderBy('createdAt','desc')
      .limit(20).get();
  }catch(e){console.warn('Repetir pedido: consulta falhou',e);return;}
  const done=snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .find(o=>o.status==='delivered'&&Array.isArray(o.items)&&o.items.length&&o.storeId);
  if(!done)return; // só exibe para quem tem ao menos um pedido concluído
  lastOrder=done;
  // se o usuário dispensou exatamente este pedido, mantém oculto até surgir um novo
  let dismissed=null;try{dismissed=localStorage.getItem(REPEAT_DISMISS_KEY)}catch(_){}
  if(dismissed===done.id)return;
  renderRepeatOrder();
}

function dismissRepeatOrder(e){
  if(e){e.stopPropagation();e.preventDefault();}
  if(lastOrder){try{localStorage.setItem(REPEAT_DISMISS_KEY,lastOrder.id)}catch(_){}}
  const wrap=document.getElementById('repeatOrderWrap');
  if(wrap)wrap.style.display='none';
}

function renderRepeatOrder(){
  if(!lastOrder)return;
  const wrap=document.getElementById('repeatOrderWrap');
  if(!wrap)return;
  const store=stores.find(s=>s.id===lastOrder.storeId);
  const img=store?.imageUrl||'';
  const name=lastOrder.storeName||store?.name||'Seu pedido';
  const summary=repeatSummary(lastOrder.items);
  const bgGrad='linear-gradient(90deg,#0b0e0c 0%,#0b0e0c 30%,rgba(11,14,12,.55) 62%,rgba(11,14,12,.10) 100%)';
  const bgLayer=img?`<div class="repeat-bg" style="background-image:${bgGrad},url('${esc(img)}')"></div>`:'';
  wrap.innerHTML=`
    <div class="repeat-card">
      ${bgLayer}
      <button class="repeat-close" type="button" onclick="dismissRepeatOrder(event)" aria-label="Dispensar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="repeat-content">
        <div class="repeat-info">
          <div class="repeat-eyebrow">Seu último pedido</div>
          <div class="repeat-store">${esc(name)}</div>
          <div class="repeat-summary">${esc(summary)}</div>
        </div>
        <div class="repeat-actions">
          <button class="repeat-btn-primary" id="repeatBtn" onclick="repeatOrder()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Repetir Pedido
          </button>
          <button class="repeat-btn-secondary" onclick="viewLastOrder()">Ver Detalhes</button>
        </div>
      </div>
    </div>`;
  wrap.style.display='';
}

function viewLastOrder(){navigateTo('orders.html')}

async function repeatOrder(){
  if(!lastOrder)return;
  const btn=document.getElementById('repeatBtn');
  if(btn)btn.disabled=true;
  try{
    const snap=await db.collection('products').where('storeId','==',lastOrder.storeId).get();
    const byId={};
    snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(p=>p.active!==false)
      .forEach(p=>{byId[p.id]=p});

    const cart=[];let missing=0;
    lastOrder.items.forEach(it=>{
      const pid=it.productId||it.id;
      const p=byId[pid];
      if(!p){missing++;return;} // item saiu do cardápio
      cart.push({
        id:p.id,
        name:p.name,
        price:productPrice(p),
        qty:it.qty||1,
        addons:Array.isArray(it.addons)?it.addons:[],
        observation:it.observation||'',
        productId:p.id,
        category:p.category||'',
        storeId:lastOrder.storeId,
        storeName:lastOrder.storeName||''
      });
    });

    if(!cart.length){
      toast('Os itens deste pedido não estão mais disponíveis');
      if(btn)btn.disabled=false;
      return;
    }

    const store=stores.find(s=>s.id===lastOrder.storeId);
    const storeInfo={
      id:lastOrder.storeId,
      name:lastOrder.storeName||store?.name||'',
      category:store?.category||lastOrder.storeCategory||'',
      deliveryType:store?.deliveryType||'app',
      phone:store?.phone||'',
      address:store?.address||''
    };
    const cartJson=JSON.stringify(cart);
    sessionStorage.setItem('pedrad_cart',cartJson);
    localStorage.setItem('pedrad_cart',cartJson);
    sessionStorage.setItem('pedrad_store',JSON.stringify(storeInfo));
    localStorage.setItem('checkoutStoreId',lastOrder.storeId);
    localStorage.setItem('cache_store_'+lastOrder.storeId,JSON.stringify({ts:Date.now(),data:storeInfo}));

    const open=store?store.isOpenNow:true;
    if(missing>0){
      toast(`${missing} item(ns) indisponível(eis) — adicionamos o restante ao carrinho`);
    }else if(!open){
      toast('Loja fechada — o pedido será enviado quando ela abrir');
    }else{
      toast('Itens adicionados ao carrinho');
    }

    setTimeout(()=>navigateTo('store.html?id='+lastOrder.storeId+'&openCart=1'),700);
  }catch(e){
    console.error('Repetir pedido falhou',e);
    toast('Não foi possível repetir o pedido');
    if(btn)btn.disabled=false;
  }
}

auth.onAuthStateChanged(user=>{
  if(!user){
    location.replace('index.html');
    return;
  }
  loadStores().then(()=>{ if(typeof WelcomePopup!=='undefined') WelcomePopup.check(); loadLastOrder(); });
  loadAddresses();
});
