<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);})()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Endereços - Pedra Delivery</title>

  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root,[data-theme="dark"]{
      --bg:#080808;--bg-card:#0e0e11;--bg-input:#121216;--bg-elevated:#191920;
      --text:#f0f0f2;--text-secondary:#8888a0;--text-muted:#505060;
      --border:#161619;--border-hover:#252530;
      --glass-bg:rgba(8,8,8,.82);--glass-border:rgba(255,255,255,.04);
      --shadow-sm:0 2px 8px rgba(0,0,0,.5);--shadow-md:0 6px 18px rgba(0,0,0,.6);
      --g:#22c55e;--g-dim:rgba(34,197,94,.10);--g-glow:rgba(34,197,94,.18);
      --primary:#22c55e;--danger:#f87171;--success:#22c55e;
    }
    *{box-sizing:border-box}
    body{background:radial-gradient(ellipse 110% 32% at 50% 0%,#0d2018 0%,transparent 68%),#080808!important;color:var(--text)}
    @keyframes appIn{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
    .page-enter{animation:appIn .21s cubic-bezier(.16,1,.3,1) both; margin:0; min-height:100vh; min-height:100dvh; }

    /* Layout */
    .addresses-container{
      min-height:100vh;
      min-height:100dvh;
      padding:20px;
      padding-top:82px;
      padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px) + 28px);
      max-width: 560px;
      margin: 0 auto;
    }

    /* Header (glass) */
    .addresses-back-header{
      position:fixed; top:0; left:0; right:0;
      height:60px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      display:flex; align-items:center; gap:12px;
      padding: 0 16px;
      z-index:100;
      border-bottom: 1px solid var(--glass-border);
    }
    .addresses-back-btn{
      width:38px; height:38px;
      border-radius:11px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      cursor:pointer;
      transition: border-color .15s, background .15s, transform .12s;
      display:flex; align-items:center; justify-content:center;
    }
    .addresses-back-btn:hover{ border-color: rgba(34,197,94,.4); background:#16161c; }
    .addresses-back-btn:active{ transform: translateY(1px); }
    .addresses-back-title{
      font-size: .98rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);
    }

    /* Section label */
    .addr-section-label{
      font-size:.66rem; font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; color:var(--text-muted); margin:2px 2px 12px;
    }

    /* Cards */
    .address-card{
      display:flex;
      gap: 13px;
      align-items: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color .16s, background .16s, box-shadow .16s;
    }
    .address-card:hover{ border-color: var(--border-hover); }
    .address-card:active{ transform: translateY(1px); }
    .address-card.selected{
      border-color: rgba(34,197,94,.4);
      background: linear-gradient(180deg, rgba(34,197,94,.05) 0%, var(--bg-card) 62%);
      box-shadow: 0 0 0 1px rgba(34,197,94,.06), 0 10px 26px rgba(0,0,0,.4);
    }
    .addr-pin{
      width: 38px; min-width: 38px; height: 38px;
      border-radius: 11px;
      display:flex; align-items:center; justify-content:center;
      background: var(--g-dim); color: var(--g);
      box-shadow: inset 0 0 10px rgba(34,197,94,.16);
    }
    .addr-pin svg{ width:18px; height:18px; }
    .address-info{ flex: 1; min-width: 0; }
    .addr-label-row{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
    .address-label{
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--text);
      font-size: .96rem;
    }
    .addr-current{
      font-size:.56rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
      color:var(--g); background:var(--g-dim); border:1px solid rgba(34,197,94,.24);
      border-radius:999px; padding:2px 7px;
    }
    .address-text{
      color: var(--text-muted);
      font-size: .84rem;
      line-height: 1.3;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .address-meta-row{
      display:flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }
    .chip{
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: .72rem;
      line-height: 1;
      font-weight: 600;
    }
    .chip.fee{ color: var(--g); border-color: rgba(34,197,94,.24); background: var(--g-dim); }
    .chip.muted{ color: var(--text-muted); }

    .actions-col{
      display:flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .icon-btn{
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s, transform .12s;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .icon-btn:hover{ border-color: rgba(248,113,113,.4); color: var(--danger); background: rgba(248,113,113,.06); }
    .icon-btn:active{ transform: translateY(1px); }
    .icon-btn svg{ width:17px; height:17px; }

    /* Footer CTA */
    .cta-row{
      margin-top: 8px;
      display:flex;
      gap: 10px;
      align-items:center;
    }
    .addr-add-btn{
      width:100%;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:14px; border-radius:14px; border:none; cursor:pointer; font-family:inherit;
      font-size:.9rem; font-weight:800; letter-spacing:-.01em;
      background:linear-gradient(180deg,#2edb6b 0%,#1db857 100%); color:#041a0c;
      box-shadow:0 6px 0 #0e8038, 0 10px 28px rgba(34,197,94,.4), inset 0 1px 0 rgba(255,255,255,.25);
      transform:translateY(-2px); transition:transform .14s, box-shadow .14s;
    }
    .addr-add-btn:hover{ transform:translateY(-4px); box-shadow:0 8px 0 #0e8038, 0 16px 36px rgba(34,197,94,.5), inset 0 1px 0 rgba(255,255,255,.28); }
    .addr-add-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #0e8038, 0 4px 12px rgba(34,197,94,.28), inset 0 1px 0 rgba(255,255,255,.15); }
    .addr-add-btn svg{ width:17px; height:17px; }

    /* Empty */
    .empty-state{
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 34px 26px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon{
      width:52px; height:52px; margin:0 auto 14px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:var(--g-dim); color:var(--g);
    }
    .empty-icon svg{ width:24px; height:24px; }
    .empty-state-title{
      color: var(--text);
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .empty-state-text{ font-size: .86rem; line-height: 1.45; }

    /* Modal refinements */
    .modal-content{
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.7);
      border: 1px solid var(--border);
      background: var(--bg-card);
    }
    .modal-header{
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    .modal-title{
      font-weight: 700;
      letter-spacing: -.01em;
      font-size: 1rem;
    }
    .modal-close{
      width: 38px; height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s;
    }
    .modal-close:hover{ border-color: var(--border-hover); }

    .input-group label{ font-size:.72rem; font-weight:600; color:var(--text-secondary); letter-spacing:.02em; }
    .input:focus, select.input:focus{
      border-color: rgba(34,197,94,.45) !important;
      box-shadow: 0 0 0 3px rgba(34,197,94,.08) !important;
      outline: none;
    }
    .modal-body .btn-primary{
      background:linear-gradient(180deg,#2edb6b 0%,#1db857 100%);
      color:#041a0c; font-weight:800; border:none;
    }

    /* Location box */
    .location-box{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,.02);
      margin: 14px 0 16px;
    }
    .location-status{
      display:flex;
      gap: 10px;
      align-items:center;
      color: var(--text-muted);
      font-size: .84rem;
      line-height: 1.2;
    }
    .status-dot{
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--border);
      box-shadow: 0 0 0 4px rgba(255,255,255,.02);
    }
    .location-status.success{ color: var(--text); }
    .location-status.success .status-dot{ background: var(--g); box-shadow: 0 0 8px rgba(34,197,94,.6); }
    .location-status.error{ color: var(--danger); }
    .location-status.error .status-dot{ background: var(--danger); }

    /* Map Picker */
    #pickerCoords{
      text-align:center;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: .85rem;
    }

    /* Small screens */
    @media (max-width: 520px){
      .addresses-container{ padding-left: 14px; padding-right: 14px; }
      .address-card{ padding: 12px; }
      .actions-col{ gap: 6px; }
    }
  </style>
<link rel="stylesheet" href="client.css">
<script src="pwa-register.js" defer></script>
<script src="page-transition.js" defer></script>
</head>

<body class="page-enter">
  <div class="addresses-back-header">
    <button class="addresses-back-btn" onclick="goBack()" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="addresses-back-title">Meus Endereços</div>
  </div>

  <div class="addresses-container">
    <div id="addressesList"></div>

    <div class="cta-row">
      <button class="addr-add-btn" onclick="showAddAddressModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar endereço
      </button>
    </div>
  </div>

  <!-- Add Address Modal -->
  <div class="modal" id="addressModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Novo Endereço</div>
        <button class="modal-close" onclick="closeModal()" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <form onsubmit="saveAddress(event)">
          <div class="input-group">
            <label>Apelido</label>
            <input type="text" class="input" id="addressLabel" placeholder="Casa" required />
          </div>

          <div class="input-group">
            <label>Rua</label>
            <input type="text" class="input" id="addressStreet" placeholder="Nome da rua" required />
          </div>

          <div class="input-group">
            <label>Número</label>
            <input type="text" class="input" id="addressNumber" placeholder="123" required />
          </div>

          <div class="input-group">
            <label>Complemento</label>
            <input type="text" class="input" id="addressComplement" placeholder="Apto, Bloco..." />
          </div>

          <div class="input-group">
            <label>Bairro</label>
            <select class="input" id="addressNeighborhood" required>
              <option value="">Selecione o bairro</option>
            </select>
          </div>

          <div class="input-group">
            <label>Ponto de referência</label>
            <input type="text" class="input" id="addressReference" placeholder="Próximo a..." />
          </div>

          <div class="location-box" id="addressLocationBox">
            <div class="location-status" id="addressLocationStatus">
              <span class="status-dot" aria-hidden="true"></span>
              <span>Localização não capturada</span>
            </div>

            <div style="display:flex;gap:8px;margin-top:12px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="captureLocation()" style="flex:1;">
                Capturar via GPS
              </button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="openMapPicker()" style="flex:1;">
                Selecionar no mapa
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Salvar endereço</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ══════════ BOTTOM NAV ══════════ -->

      Início

      Perfil
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAnIJRcUxN-0swpVnonPbJjTSK87o4CQ_g",
      authDomain: "pedrad-814d0.firebaseapp.com",
      projectId: "pedrad-814d0",
      storageBucket: "pedrad-814d0.firebasestorage.app",
      messagingSenderId: "293587190550",
      appId: "1:293587190550:web:80c9399f82847c80e20637"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let addresses = [];
    let deliveryFees = [];
    let capturedLocation = null;
    let selectedAddressId = null;

    // Chaves compartilhadas com checkout.js e a barra de endereço da home
    const SEL_ADDR_KEY = "pedrad_selected_address";
    const ADDR_CACHE_PREFIX = "cache_addresses_v1_";

    function getStoredAddressId() {
      try { return localStorage.getItem(SEL_ADDR_KEY) || null; } catch (_) { return null; }
    }
    // Mantém o cache lido pelo checkout/home em dia após adicionar/excluir
    function syncAddressCache() {
      if (!currentUser) return;
      try {
        localStorage.setItem(ADDR_CACHE_PREFIX + currentUser.uid, JSON.stringify({ ts: Date.now(), data: addresses }));
      } catch (_) {}
    }
    // Garante que o endereço selecionado aponte para um endereço existente
    function ensureSelectedAddress() {
      if (selectedAddressId && addresses.some((a) => a.id === selectedAddressId)) return;
      const stored = getStoredAddressId();
      if (stored && addresses.some((a) => a.id === stored)) { selectedAddressId = stored; return; }
      selectedAddressId = addresses.length ? addresses[0].id : null;
      try {
        if (selectedAddressId) localStorage.setItem(SEL_ADDR_KEY, selectedAddressId);
        else localStorage.removeItem(SEL_ADDR_KEY);
      } catch (_) {}
    }

    // Auth Guard
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await loadDeliveryFees();
        await loadAddresses();
        populateNeighborhoodSelect();
        renderAddresses();
      } else {
        window.location.href = "index.html";
      }
    });

    // Load Delivery Fees
    async function loadDeliveryFees() {
      try {
        const snapshot = await db.collection("deliveryFees").where("active", "==", true).get();
        deliveryFees = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        deliveryFees.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      } catch (err) {
        console.error("Error loading fees:", err);
      }
    }

    // Load Addresses
    async function loadAddresses() {
      if (!currentUser) return;

      try {
        const snapshot = await db.collection("users").doc(currentUser.uid).collection("addresses").get();
        addresses = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        ensureSelectedAddress();
        syncAddressCache();
      } catch (err) {
        console.error("Error loading addresses:", err);
      }
    }

    // Render Addresses
    function renderAddresses() {
      const container = document.getElementById("addressesList");
      if (!container) return;

      if (addresses.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="empty-state-title">Nenhum endereço cadastrado</div>
            <div class="empty-state-text">Adicione um endereço para habilitar entregas e calcular a taxa automaticamente.</div>
          </div>
        `;
        return;
      }

      const pinSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
      const trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

      container.innerHTML =
        '<div class="addr-section-label">Toque para entregar aqui</div>' +
        addresses
          .map((addr) => {
            const fee = getDeliveryFee(addr.neighborhood);
            const hasGPS = !!addr.location;
            const isSel = addr.id === selectedAddressId;

            return `
            <div class="address-card ${isSel ? "selected" : ""}" onclick="selectAddress('${escapeAttr(addr.id)}')">
              <div class="addr-pin" aria-hidden="true">${pinSvg}</div>

              <div class="address-info">
                <div class="addr-label-row">
                  <span class="address-label">${escapeHtml(addr.label || "Endereço")}</span>
                  ${isSel ? '<span class="addr-current">Em uso</span>' : ""}
                </div>

                <div class="address-text">${escapeHtml(addr.street || "")}${addr.number ? ", " + escapeHtml(addr.number) : ""}</div>
                ${addr.complement ? `<div class="address-text">${escapeHtml(addr.complement)}</div>` : ""}
                <div class="address-text">${escapeHtml(addr.neighborhood || "")}</div>
                ${addr.reference ? `<div class="address-text">Ref: ${escapeHtml(addr.reference)}</div>` : ""}

                <div class="address-meta-row">
                  <span class="chip fee">Taxa: ${formatCurrency(fee)}</span>
                  <span class="chip muted">${hasGPS ? "Localização salva" : "Sem localização"}</span>
                </div>
              </div>

              <div class="actions-col">
                <button class="icon-btn" onclick="event.stopPropagation(); deleteAddress('${escapeAttr(addr.id)}')" aria-label="Excluir endereço">${trashSvg}</button>
              </div>
            </div>
          `;
          })
          .join("");
    }

    // Selecionar endereço de entrega (sincroniza com checkout/home)
    function selectAddress(id) {
      if (!id) return;
      selectedAddressId = id;
      try { localStorage.setItem(SEL_ADDR_KEY, id); } catch (_) {}
      renderAddresses();
      const a = addresses.find((x) => x.id === id);
      showToast("Entregar em " + (a?.label || "endereço"));
    }

    // Get Delivery Fee
    function getDeliveryFee(neighborhood) {
      if (!neighborhood) return 0;
      const fee = deliveryFees.find((f) => (f.name || "").toLowerCase() === neighborhood.toLowerCase());
      return fee?.fee || 0;
    }

    // Populate Neighborhood Select
    function populateNeighborhoodSelect() {
      const select = document.getElementById("addressNeighborhood");
      if (!select) return;

      select.innerHTML =
        '<option value="">Selecione o bairro</option>' +
        deliveryFees
          .map((f) => `<option value="${escapeAttr(f.name)}">${escapeHtml(f.name)} - ${formatCurrency(f.fee)}</option>`)
          .join("");
    }

    // Show Add Address Modal
    function showAddAddressModal() {
      const fields = ["addressLabel", "addressStreet", "addressNumber", "addressComplement", "addressNeighborhood", "addressReference"];
      fields.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });

      capturedLocation = null;

      const status = document.getElementById("addressLocationStatus");
      if (status) {
        status.innerHTML = `<span class="status-dot" aria-hidden="true"></span><span>Localização não capturada</span>`;
        status.className = "location-status";
      }

      document.getElementById("addressModal").classList.add("active");
    }

    // Close Modal
    function closeModal() {
      document.getElementById("addressModal").classList.remove("active");
    }

    // Capture Location
    function captureLocation() {
      const status = document.getElementById("addressLocationStatus");

      if (!navigator.geolocation) {
        if (status) {
          status.innerHTML = '<span class="status-dot" aria-hidden="true"></span><span>GPS não disponível</span>';
          status.className = "location-status error";
        }
        showToast("GPS não disponível neste dispositivo");
        return;
      }

      if (status) {
        status.innerHTML = '<span class="status-dot" aria-hidden="true"></span><span>Obtendo localização...</span>';
        status.className = "location-status";
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          capturedLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy
          };

          if (status) {
            status.innerHTML = `<span class="status-dot" aria-hidden="true"></span><span>Localização capturada (precisão: ${Math.round(
              position.coords.accuracy
            )}m)</span>`;
            status.className = "location-status success";
          }

          showToast("Localização capturada");
        },
        (error) => {
          let msg = "Erro ao obter localização";
          if (error.code === error.PERMISSION_DENIED) msg = "Permissão negada";
          if (error.code === error.POSITION_UNAVAILABLE) msg = "Localização indisponível";
          if (error.code === error.TIMEOUT) msg = "Tempo esgotado";

          if (status) {
            status.innerHTML = `<span class="status-dot" aria-hidden="true"></span><span>${msg}</span>`;
            status.className = "location-status error";
          }

          showToast(msg);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    // Open Map Picker
    function openMapPicker() {
      const modal = document.createElement("div");
      modal.id = "mapPickerModal";
      modal.className = "modal active";
      modal.innerHTML = `
        <div class="modal-content" style="height:90vh;max-height:90vh;display:flex;flex-direction:column;">
          <div class="modal-header">
            <div class="modal-title">Selecionar localização</div>
            <button class="modal-close" onclick="closeMapPicker()" aria-label="Fechar">×</button>
          </div>
          <div id="pickerMap" style="flex:1;min-height:300px;background:var(--bg-input);"></div>
          <div style="padding:16px;">
            <div id="pickerCoords">Toque no mapa para selecionar</div>
            <button class="btn btn-primary" id="confirmLocationBtn" disabled onclick="confirmPickedLocation()">
              Confirmar
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      setTimeout(() => {
        const map = L.map("pickerMap").setView([-15.8267, -47.9218], 13);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap"
        }).addTo(map);

        let marker = null;
        window._pickedLocation = null;

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 16),
            () => {},
            { timeout: 5000 }
          );
        }

        map.on("click", (e) => {
          if (marker) map.removeLayer(marker);

          marker = L.marker(e.latlng).addTo(map);
          window._pickedLocation = { lat: e.latlng.lat, lng: e.latlng.lng };

          const coordsEl = document.getElementById("pickerCoords");
          const confirmBtn = document.getElementById("confirmLocationBtn");

          if (coordsEl) coordsEl.textContent = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
          if (confirmBtn) confirmBtn.disabled = false;
        });
      }, 100);
    }

    function closeMapPicker() {
      document.getElementById("mapPickerModal")?.remove();
    }

    function confirmPickedLocation() {
      if (!window._pickedLocation) return;

      capturedLocation = { ...window._pickedLocation, accuracy: 0, manual: true };

      const status = document.getElementById("addressLocationStatus");
      if (status) {
        status.innerHTML = `<span class="status-dot" aria-hidden="true"></span><span>Localização selecionada</span>`;
        status.className = "location-status success";
      }

      closeMapPicker();
      showToast("Localização definida");
    }

    // Save Address
    async function saveAddress(e) {
      e.preventDefault();
      if (!currentUser) return;

      const neighborhood = document.getElementById("addressNeighborhood")?.value;

      if (!neighborhood) {
        showToast("Selecione um bairro");
        return;
      }

      const address = {
        label: document.getElementById("addressLabel")?.value || "",
        street: document.getElementById("addressStreet")?.value || "",
        number: document.getElementById("addressNumber")?.value || "",
        complement: document.getElementById("addressComplement")?.value || "",
        neighborhood: neighborhood,
        reference: document.getElementById("addressReference")?.value || "",
        location: capturedLocation,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        const docRef = await db.collection("users").doc(currentUser.uid).collection("addresses").add(address);

        address.id = docRef.id;
        addresses.push(address);

        // Se ainda não havia um endereço de entrega válido, usa o recém-criado
        const hadValidSelection = selectedAddressId && addresses.some((a) => a.id === selectedAddressId);
        if (!hadValidSelection) {
          selectedAddressId = address.id;
          try { localStorage.setItem(SEL_ADDR_KEY, address.id); } catch (_) {}
        }
        syncAddressCache();

        closeModal();
        renderAddresses();
        showToast("Endereço salvo com sucesso");
      } catch (err) {
        console.error("Error saving address:", err);
        showToast("Erro ao salvar endereço");
      }
    }

    // Delete Address
    async function deleteAddress(addressId) {
      if (!confirm("Deseja excluir este endereço?")) return;
      if (!currentUser) return;

      try {
        await db.collection("users").doc(currentUser.uid).collection("addresses").doc(addressId).delete();

        addresses = addresses.filter((a) => a.id !== addressId);
        // Se o endereço removido era o de entrega, reaponta para outro (ou limpa)
        if (selectedAddressId === addressId) {
          selectedAddressId = null;
          ensureSelectedAddress();
        }
        syncAddressCache();
        renderAddresses();
        showToast("Endereço excluído");
      } catch (err) {
        console.error("Error deleting address:", err);
        showToast("Erro ao excluir endereço");
      }
    }

    // Go Back
    function goBack() {
      if (document.referrer.includes(window.location.host)) window.history.back();
      else window.location.href = "profile.html";
    }

    // Format Currency
    function formatCurrency(value) {
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value || 0);
    }

    // Toast
    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Modal click outside
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("modal")) e.target.classList.remove("active");
    });

    // Basic escape helpers (mantém lógica, evita injeção em render)
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function escapeAttr(str){ return escapeHtml(str).replaceAll("`","&#096;"); }
  </script>
<script src="safe-area.js" defer></script>
<script src="swipe-back.js" defer></script>
<script src="security-monitor.js" defer></script>
